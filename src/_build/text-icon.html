<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>文字与图标助手</title>
<style>
  :root{ --线:#dcdcdc; --字:#1c1c1c; --淡:#776f66; --底:#f4f2ef; --块:#fffdfb; --好:#1d6b3f; --急:#9c2a2a; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:0 18px 26px; background:var(--底); color:var(--字);
        font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif; }
  header{ position:sticky; top:0; z-index:2; background:var(--底); padding:14px 0 10px; border-bottom:1px solid var(--线); }
  h1{ margin:0 0 6px; font-size:17px; font-weight:600; letter-spacing:.02em; }
  .状态{ color:var(--淡); font-size:13px; }
  .状态 b{ color:var(--字); font-weight:600; }
  .状态 .坏{ color:var(--急); }
  .行{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:10px; }
  label{ font-size:13px; color:var(--淡); }
  input[type=text]{ font:inherit; padding:5px 8px; border:1px solid var(--线); border-radius:2px; background:var(--块); min-width:190px; }
  select{ font:inherit; padding:5px 6px; border:1px solid var(--线); border-radius:2px; background:var(--块); }
  button{ font:inherit; padding:6px 14px; border:1px solid #b9b1a8; border-radius:2px; background:var(--块); cursor:pointer; }
  button:hover{ background:#f0ece7; }
  button.主{ background:var(--字); color:#fff; border-color:var(--字); }
  button.主:hover{ background:#3a3a3a; }
  button:disabled{ opacity:.45; cursor:default; }
  .格{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:12px; margin-top:14px; }
  .笔{ background:var(--块); border:1px solid var(--线); border-top:3px solid #b9b1a8; padding:11px 13px 13px; }
  .笔.停{ border-top-color:#cfc7bd; color:var(--淡); }
  .笔.动{ border-top-color:var(--好); box-shadow:inset 0 0 0 1px var(--好); }
  .笔.动 .名::after{ content:' · 刚动过'; color:var(--好); font-weight:600; }
  .好{ color:var(--好); }
  .字行.改{ background:#f1f7f2; border-left-color:var(--好); }
  .字行.改 .句{ color:var(--好); }
  .筛{ font-size:13px; color:var(--淡); white-space:nowrap; }
  .名{ font-weight:600; }
  .副{ color:var(--淡); font-size:12.5px; margin-top:1px; }
  .项{ font-size:13px; margin-top:8px; }
  .项 span{ color:var(--淡); }
  .底{ margin-top:16px; border-top:1px solid var(--线); padding-top:12px; }
  .志{ background:#1f1d1b; color:#e6e2dc; font-family:ui-monospace,Consolas,monospace; font-size:12.5px;
      line-height:1.5; padding:10px 12px; height:300px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  .志:empty{ display:none; }
  .提示{ font-size:13px; color:var(--淡); margin-top:6px; }
  .淡{ color:var(--淡); font-size:12.5px; }
  .页签{ display:flex; gap:10px; margin:0 0 8px; }
  .页{ font:inherit; font-size:14px; padding:2px 2px 5px; border:0; border-bottom:2px solid transparent; border-radius:0;
      background:none; color:var(--淡); cursor:pointer; }
  .页:hover{ background:none; color:var(--字); }
  .页.主{ background:none; color:var(--字); border-bottom-color:var(--字); font-weight:600; }
  .图预览{ margin-top:7px; height:56px; display:flex; align-items:center; }
  .图预览 img{ max-height:56px; max-width:120px; }
  /* 界面文字那一栏：一屏一段、一段一行。他 2026-10-17 第 1 条：三格离得太远，勾「这句不要了」时
     看不清勾的是哪一句 —— 原句与输入框各给一个定宽，勾选那颗紧跟在输入框后面，右边空出来的不算一格；
     勾上的那一行整行标红并在原句上划一道，鼠标走过哪一行也看得见。 */
  #字格{ grid-template-columns:1fr; }
  .字行{ display:flex; align-items:center; gap:12px; padding:3px 6px; border-left:3px solid transparent; }
  .字行:hover{ background:#f7f3ee; }
  .字行 .句{ flex:0 0 24em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
             color:var(--字); font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .字行 input[type=text]{ flex:0 0 24em; min-width:0; }
  .字行 label{ flex:0 0 auto; white-space:nowrap; }
  .字行.删{ background:#fbeeea; border-left-color:var(--急); }
  .字行.删 .句{ text-decoration:line-through; color:var(--急); }
  /* 图标柜：指定一格，把里面能预览的图全画出来，点中一张去换 / 去加。
     左右并列（他 2026-10-17 那句「滚动下去了就看不到图标库怎么挑！！换成左右并列」）：
     左栏自己滚、顶上填路径那一行钉住不动，右栏那一片卡自己滚 —— 两栏同时在屏幕上。 */
  .两栏{ display:grid; grid-template-columns:minmax(340px,32%) 1fr; gap:14px; align-items:start; }
  .柜栏{ display:flex; flex-direction:column; height:calc(100vh - 150px); min-width:0; }
  .柜栏 > .行{ position:sticky; top:0; z-index:1; background:var(--底); }
  .卡栏{ height:calc(100vh - 150px); overflow:auto; min-width:0; }
  .柜{ flex:1 1 auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:8px;
        border:1px solid var(--线); background:var(--块); padding:10px; overflow:auto; align-content:start; }
  .柜格{ display:flex; flex-direction:column; align-items:center; gap:4px; font:inherit; font-size:12px;
         padding:6px 4px; border:1px solid transparent; border-radius:3px; background:none; cursor:pointer; color:var(--字); }
  .柜格:hover{ border-color:#b9b1a8; background:#f7f3ee; }
  .柜格.中{ border-color:var(--好); background:#eef6f0; }
  .柜格 img{ width:40px; height:40px; object-fit:contain; background:#fff; border:1px solid var(--线); }
  .柜格 span{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .柜脚{ grid-column:1 / -1; }
  .挑{ font-size:13px; color:var(--急); }
  .挑:empty{ display:none; }
  /* 占位符（他 2026-10-17 那句「缺失图标的给一个占位符，让我在这里可以替换！」）：
     索引登记了、盘上还没有的那一张也占一格，空位看得见边界，点「放一张进去」到柜里挑一张就落下去 */
  .占位{ width:56px; height:56px; border:2px dashed #b9b1a8; display:flex; align-items:center; justify-content:center;
        font-size:12px; color:var(--淡); }
  .厂{ font-size:13px; }
  .厂 .坏{ color:var(--急); }
  @media (max-width:1100px){ .两栏{ grid-template-columns:1fr; } .柜栏,.卡栏{ height:auto; } .柜{ max-height:340px; } }
</style>
</head>
<body>
<header>
  <h1>文字与图标助手</h1>
  <div class="页签">
    <button id="t图" class="页 主">图标素材</button>
    <button id="t字" class="页">界面文字</button>
  </div>
  <div class="状态" id="状态">正在看现在的状况……</div>
</header>
  <div class="提示" id="提示"></div>
  <div class="提示" id="git警"></div>

<div id="p图" hidden>
 <div class="两栏">
  <div class="柜栏">
    <div class="行">
      <label for="柜路">图标文件夹</label>
      <input type="text" id="柜路" placeholder="这台电脑上放图标的那个文件夹" autocomplete="off" spellcheck="false" style="flex:1 1 160px;min-width:150px">
      <button id="柜列">列出这个文件夹</button>
    </div>
    <div class="行">
      <label for="柜搜">找</label>
      <input type="text" id="柜搜" placeholder="名字里有这几个字" autocomplete="off" style="flex:1 1 140px;min-width:120px">
      <input type="file" id="柜档" accept=".svg,.png,.jpg,.jpeg,.webp,.gif">
    </div>
    <div class="挑" id="挑话"></div>
    <div class="柜" id="柜格" hidden></div>
  </div>
  <div class="卡栏">
    <div class="行">
      <span class="状态" id="图情">正在数图标文件夹里的图……</span>
      <span style="flex:1"></span>
      <button id="图重">重新数一遍</button>
      <button id="图对">重新生成图标索引</button>
      <button id="厂全">把和打包用的那一份不一样的，全部复制过去</button>
      <label class="筛"><input type="checkbox" id="图筛"><span id="图筛标">只看我动过的</span></label>
    </div>
    <div class="行">
      <label for="加名">加一张图</label>
      <input type="text" id="加名" placeholder="名字空着就照挑中的文件名改（如 gear2.svg；子文件夹写成 tools/gear2.svg）" autocomplete="off" spellcheck="false" style="min-width:220px">
      <input type="file" id="加档" accept=".svg,.png,.jpg,.jpeg,.webp,.gif">
      <button id="加送">添进去</button>
      <button id="加柜">从图标文件夹里挑一张添进去</button>
    </div>
    <div class="提示" id="图果"></div>
    <div class="提示" id="图动"></div>
    <div class="格" id="图格"></div>
  </div>
 </div>
</div>

<div id="p字" hidden>
  <div class="行">
    <label for="字段">哪一页</label>
    <select id="字段"></select>
    <label for="字搜">找</label>
    <input type="text" id="字搜" placeholder="原句或改后的句子里含这几个字" autocomplete="off">
    <span class="状态" id="字情">正在读句子清单 data\ui-text.yaml……</span>
  </div>
  <div class="行">
    <span style="flex:1"></span>
    <button id="字扫">刷新清单</button>
    <button id="字存">保存这些句子</button>
    <button id="字预">预览改动</button>
    <button id="字落" class="主">写进源码</button>
    <button id="字重">重新生成页面</button>
    <label class="筛"><input type="checkbox" id="字筛"><span id="字筛标">只看改过的</span></label>
  </div>
  <div class="提示" id="字数"></div>
  <div class="提示" id="字果"></div>
  <div class="格" id="字格"></div>
</div>

<div class="底">
  <div class="志" id="志"></div>
</div>

<script>
const 码 = '__码__';
const 取 = id => document.getElementById(id);
let 跑着 = false;   /* 跑着 = 这一台有一趟正在跑 */

async function 问(){
  const 对 = await (await fetch('/api/现场')).json();
  const 问不出 = 对.git好 === false;
  取('git警').innerHTML = 问不出 ? '<b class="坏">' + 文(对.git话 || '小助手叫不动 git') + '</b> —— 顶上那一行的分支和「有没有没提交的」问不出，就写问不出。改句子、改图标这两样不要 git，照旧能使。' : '';
  const 脏 = 问不出 ? '<b class="坏">盘上问不出（git 叫不动）</b>' : 对.脏 ? '<b class="坏">本地有 ' + 对.脏 + ' 处改动还没提交</b>' : '本地改动都提交完了';
  取('状态').innerHTML = '你这份代码现在在 <b>' + 对.站 + '</b> 这条分支上 · ' + 脏 +
    (对.开着 ? ' · <b class="坏">Flow-Desk 正开着</b>（改完要重开窗口才看得见）' : '') +
    ' · 小助手只管两样：改界面上的句子、改图标。';
  跑着 = !!对.在跑;
  跑态();
}
/* 一次只跑一趟：跑着的时候那几颗会动手的钮全按住（2026-10-14 他那条「点了没反应」） */
function 跑态(){
  for(const id of ['图重', '图对', '厂全', '加送', '柜列', '字扫', '字存', '字预', '字落', '字重']){
    const 钮 = 取(id); if(钮) 钮.disabled = 跑着;
  }
}

function 文(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function 编(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

async function 跑(路, 标题, 身){
  取('志').textContent = '';
  跑着 = true; 跑态();
  取('提示').textContent = 标题 + ' 正在跑……（这一趟要几分钟，别关这个窗口；日志在下面一段段出来）';
  const 头 = { 'x-push-code':码 };
  if(身) 头['content-type'] = 'application/json';
  const 回 = await fetch('/api/' + 路, { method:'POST', headers:头, body: 身 ? JSON.stringify(身) : undefined });
  if(!回.ok){ 取('志').textContent = await 回.text(); 取('提示').textContent = ''; 跑着 = false; 跑态(); 问(); return; }
  const 读 = 回.body.getReader(), 解 = new TextDecoder('utf8');
  const 志 = 取('志');
  for(;;){
    const { value, done } = await 读.read();
    if(done) break;
    志.textContent += 解.decode(value, { stream:true });
    志.scrollTop = 志.scrollHeight;
  }
  取('提示').textContent = 标题 + ' 跑完了 · ' + (志.textContent.trim().split('\n').pop() || '');
  跑着 = false; 跑态();
  问();
}

/* ---------- 两页签：图标素材 / 界面文字（「版本与推送」那一页 2026-10-16 整块撤了） ---------- */
let 图单 = [];
/* 这一屏动过哪几张：名 → { 做, 时 }，只活在页面这一趟里（删掉的那张卡不在了，另记在 __删过__ 那一格，只报数）*/
const 动过 = new Map();
let 只看动过 = false;
const 动清单 = () => [...动过.entries()].filter(([名]) => 名 !== '__删过__').map(([名, v]) => Object.assign({ 名 }, v));
const 动数 = () => { const 计 = { 换:0, 加:0, 删:0 }; for(const v of 动清单()) 计[v.做] = (计[v.做] || 0) + 1; return 计; };
function 图上数(){
  const 计 = 动数(), 动 = 动清单(), 删的 = 动过.get('__删过__');
  取('图动').innerHTML = 动.length
    ? '<b class="好">这一屏你动过 ' + 动.length + ' 张</b>（换 ' + (计.换 || 0) + ' · 加 ' + (计.加 || 0) + ' · 删 ' + (计.删 || 0) + '）'
      + (删的 && 删的.单 && 删的.单.length ? ' · 删掉的是：' + 文(删的.单.join('、')) : '')
      + '<span class="淡"> · 这一份只在这一屏里记着，重开就清</span>' : '';
  const 标 = 取('图筛标'); if(标) 标.textContent = '只看我动过的' + (动.length ? '（' + 动.length + '）' : '');
}
function 记一笔(名, 做){
  if(做 === '删'){ const 旧 = 动过.get('__删过__') || { 做:'删', 时:Date.now(), 单:[] }; 旧.单.push(String(名).replace(/^.*[\/]/, '')); 旧.时 = Date.now(); 动过.set('__删过__', 旧); }
  动过.set(String(名), { 做, 时: Date.now() });
}
function 切页(谁){
  for(const k of ['图','字']){ 取('p' + k).hidden = k !== 谁; 取('t' + k).className = '页' + (k === 谁 ? ' 主' : ''); }
  if(谁 === '图' && !图单.length) 数图();
  if(谁 === '字' && !字条.length) 字读();
}
取('t图').onclick = () => 切页('图');
取('t字').onclick = () => 切页('字');

async function 数图(){
  取('图情').textContent = '正在数图标文件夹里的图……';
  const 对 = await (await fetch('/api/图标')).json();
  图单 = 对.单 || [];
  const 插件 = 对.插件 || [];
  const 没图 = 对.没图条目 || [];
  const 没进厂 = 对.没进厂 || [];
  取('图情').innerHTML = 对.错 ? '读不到：' + 文(对.错)
    : '图标文件夹 ' + 对.张 + ' 张 + 插件包自己那一份 ' + 对.插件张 + ' 张 · 每一张干什么、哪份代码叫它几次，读的是 icons\\索引.txt（只认这份索引里登记的，小助手不另搜一套）'
      + (对.没登记 && 对.没登记.length ? '<br><b class="坏">索引里没登记这 ' + 对.没登记.length + ' 张：' + 文(对.没登记.join('、')) + '</b> —— 点上面的「重新生成图标索引」' : '')
      + (没图.length ? '<br><b class="坏">索引里登记了，可图标文件夹里没这一张：' + 没图.length + ' 张</b> —— 下面那几格空位点「放一张进去」就能补上，图标文件夹和打包用的那一份两处一起写' : '')
      + (对.插件丢图 && 对.插件丢图.length ? '<br><b class="坏">索引里登记了，可那个文件夹里还没那张封面：' + 文(对.插件丢图.join('、')) + '</b> —— 卡片上的空位点「放一张封面进去」' : '')
      + (没图.length || (对.插件丢图 && 对.插件丢图.length) ? '<br><span class="淡">插件包那一张封面住在它自己那一家的 data\\plugins\\&lt;包&gt;\\images\\ 里（一家一个仓），主程序这个文件夹里没有就去问隔壁那七家</span>' : '')
      + (没进厂.length ? '<br><b class="坏">' + 没进厂.length + ' 张和打包用的那一份不一样</b>（装到机器上带的是 src\\pack\\icons\\ 那一份）：' +
          文(没进厂.slice(0, 10).join('、')) + (没进厂.length > 10 ? ' …' : '') : '');
  const 厂钮 = 取('厂全');
  厂钮.hidden = !没进厂.length;
  厂钮.textContent = '把和打包用的那一份不一样的 ' + 没进厂.length + ' 张，复制过去';
  图上数();
  const 格 = 取('图格'); 格.innerHTML = '';
  const 厂行 = x => x.出厂 === '同'
    ? '<span class="淡"> 打包用的那一份 src\\pack\\icons\\ 已经是这一张（装到机器上带的就是它）</span>'
    : '<button data-厂="' + 编(x.名) + '">复制过去</button><span class="淡"> 打包用的那一份 src\\pack\\icons\\' +
      (x.出厂 === '没有' ? '还没有这一张' : '还是老图') + ' —— 装到机器上带的是那一份，不是这里</span>';
  const 张 = (x, 图路, 通用) => {
    const 动 = 动过.get(x.名);
    if(只看动过 && !动) return;
    const 盒 = document.createElement('div');
    盒.className = '笔' + (动 ? ' 动' : '') + (x.在不在 === false ? ' 停' : '');
    盒.innerHTML = '<div class="名">' + 文(x.键) + '</div>' +
      '<div class="副">' + 文(x.名) + ' · ' + 文(x.层) + (x.大 >= 0 ? ' · ' + x.大.toLocaleString() + ' 字节' : ' · 这个文件夹里还没有这一张') +
      (x.出自 ? ' · 在 ' + 文(x.出自) + ' 这个仓里' : '') + (x.段 ? ' · ' + 文(x.段) : '') + '</div>' +
      /* 动过的带一个时间戳：地址不换的话浏览器那一层照旧给你旧图（路由回的是 no-store，img 那层缓存照吃）*/
      (x.大 >= 0 ? '<div class="图预览"><img src="' + 图路 + (动 ? '&t=' + 动.时 : '') + '" alt="' + 编(x.键) + ' 读不出图"></div>'
        : '<div class="图预览"><div class="占位">还没有图</div></div>') +
      (动 ? '<div class="项"><b class="好">这一张你刚' + 动.做 + '过</b><span class="淡"> · ' + new Date(动.时).toLocaleTimeString('zh-CN', { hour12:false }) + ' · 要记进图标索引，点上面「重新生成图标索引」</span></div>' : '') +
      (x.说 ? '<div class="项">' + 文(x.说) + '</div>'
        : x.登记 === false ? '<div class="项"><b class="坏">图标索引里还没有这一张</b>：点上面「重新生成图标索引」把它记上</div>'
        : '<div class="项"><b class="坏">图标索引里这一张没写它是干什么的</b>：那句说明住在 src\\_build\\ico-index.mjs 那张表里，要补得改那一处（小助手不替你编）</div>') +
      (x.引用 ? '<div class="项"><span>引用 </span>' + 文(x.引用) + '</div>' : '') +
      (通用 ? '<div class="项"><button data-换="' + 编(x.名) + '">换这张</button> <button data-删="' + 编(x.名) + '">删这张</button>' + 厂行(x) + '</div>'

    if(to === String(r.to || '') && del === !!r.del) return;
    改.push({ prog:r.prog, page:r.page, from:r.from, to, del });
  });
  return 改;
}
/* 勾与不勾当场见效：那一行整行标红、原句上划一道，不用等「保存这些句子」 */
取('字格').addEventListener('change', e => {
  const 勾 = e.target && e.target.closest && e.target.closest('input[data-d]');
  const 行 = 勾 && 勾.closest && 勾.closest('.字行');
  if(行) 行.classList.toggle('删', !!勾.checked);
});
/* 打字与勾选当场翻那一行的样子（不等「保存这些句子」）：行标色 + 计数跟着动 */
取('字格').addEventListener('input', e => {
  const 框 = e.target && e.target.closest && e.target.closest('input[data-i]');
  if(!框) return;
  const r = 当前[+框.dataset['i']]; if(!r) return;
  r.to = 框.value;
  const 行 = 框.closest('.字行');
  if(行){ 行.classList.toggle('改', !r.del && !!String(框.value).trim()); 行.classList.toggle('删', !!r.del); }
  字数();
});
取('字段').onchange = 字画;
取('字搜').oninput = 字画;

取('字存').onclick = async () => {
  const 改 = 字集();

  const 回 = await fetch('/api/文字/存', { method:'POST', headers:{ 'content-type':'application/json','x-push-code':码 }, body: JSON.stringify({ 改 }) });
  const 回文 = await 回.text();

  取('字果').textContent = '写进 data\\ui-text.yaml 了：' + JSON.parse(回文).动了 + ' 句。要让它上到界面上，还得「预览改动」→「写进源码」→「重新生成页面」。';
  字读();
};
async function 字走(哪道, 话){
  取('字果').textContent = 话 + '……（这一趟要扫一遍源码，几秒）';
  const 回 = await fetch('/api/文字/' + 哪道, { method:'POST', headers:{ 'content-type':'application/json','x-push-code':码 }, body: JSON.stringify({}) });
  const 回文 = await 回.text();
  if(!回.ok){ 取('字果').innerHTML = '<b class="坏">' + 文(回文) + '</b>'; return; }
  const 对 = JSON.parse(回文);
  const 落点 = [];
  对.成.forEach(x => (x.at || []).forEach(a => { if(!落点.includes(a)) 落点.push(a); }));
  取('字果').innerHTML = (对.落 ? '<b>已经写进源码 ' + 对.写了.length + ' 份文件</b> · ' : '预览（一个字没写）· ')
    + '清单里填了 ' + 对.递 + ' 句 · ' + (对.落 ? '写掉了' : '对得上位置、要改') + ' ' + 对.成.length + ' 句（' + 落点.length + ' 处）'
    + (对.对不上.length ? ' · <b class="坏">对不上 ' + 对.对不上.length + ' 句</b>（清单里那一句原话在当前源码里一处都认不到，多半是那句已经被别处改过：先点「刷新清单」再看）' : '')
    + (对.落 && 对.成.length ? '<br>落点：' + 文(落点.join('、'))
        + '<br>写进了这些文件（隔壁那几个仓里的写成「仓名/路径」）：' + 文((对.写了 || []).join('、') || '一份没有')
        + '<br><b>界面上这会儿还没变</b>：改的是源码，得再点一次「重新生成页面」（' + 文((对.重跑 || []).join(' → ')) + '），重开窗口才看得见。' : '');
}
